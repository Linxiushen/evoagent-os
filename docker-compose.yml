services:
  gateway:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - ./personas:/app/personas:ro
      - model-cache:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# Qwen3-ASR, VoxCPM2 and SoulX deliberately run as separate GPU workers.
# Their CUDA / Python dependency stacks conflict, so deploy them following
# docs/DEPLOYMENT.md and point the *_BASE_URL variables at those workers.

volumes:
  model-cache:
