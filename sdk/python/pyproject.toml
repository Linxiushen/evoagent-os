[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-sdk"
version = "0.1.0"
description = "Typed synchronous Python client for the EvoAgent OS control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "EvoAgent OS Contributors"}]
dependencies = [
  "evoagent-contracts>=0.1,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/Linxiushen/evoagent-os"
Repository = "https://github.com/Linxiushen/evoagent-os"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

