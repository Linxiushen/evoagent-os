[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-worker"
version = "0.1.0"
description = "Reference remote worker for EvoAgent OS"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
evoagent-worker = "evoagent_worker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
