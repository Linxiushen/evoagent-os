[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "harnesslab"
version = "0.1.0"
description = "A protocol-first conformance lab and trace console for agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Linxiushen" }]
keywords = ["agents", "harness", "mcp", "deepseek", "conformance", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.8,<2"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[project.urls]
Homepage = "https://github.com/Linxiushen/harnesslab"
Repository = "https://github.com/Linxiushen/harnesslab"
Issues = "https://github.com/Linxiushen/harnesslab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.hatch.build.targets.sdist]
include = ["src/harnesslab", "tests", "examples", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

