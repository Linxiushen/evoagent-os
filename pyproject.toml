[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-runtime"
version = "0.1.0"
description = "Local-first agent gateway with governed self-evolution"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "EvoAgent Runtime Contributors"}]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
evoagent-runtime = "evoagent_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/Linxiushen/evoagent-runtime"
Repository = "https://github.com/Linxiushen/evoagent-runtime"
Documentation = "https://github.com/Linxiushen/evoagent-runtime/blob/main/README.zh-CN.md"
Issues = "https://github.com/Linxiushen/evoagent-runtime/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evoagent_runtime = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
