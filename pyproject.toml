[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-fleet"
version = "0.1.0"
description = "Durable multi-agent control plane with evaluation-driven routing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
evoagent-fleet = "evoagent_fleet.cli:main"

[project.urls]
Homepage = "https://github.com/Linxiushen/evoagent-fleet"
Repository = "https://github.com/Linxiushen/evoagent-fleet"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evoagent_fleet = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
