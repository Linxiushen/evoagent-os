[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-contracts"
version = "0.1.0"
description = "Versioned Python contracts for the EvoAgent control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "EvoAgent OS Contributors"}]
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
evoagent-contracts-schema = "evoagent_contracts.schema:main"

[project.urls]
Homepage = "https://github.com/Linxiushen/evoagent-os"
Repository = "https://github.com/Linxiushen/evoagent-os"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

