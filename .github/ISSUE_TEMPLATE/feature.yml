name: Feature request
description: Propose a bounded, consent-preserving improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include protocol, latency, privacy, and failure-mode implications where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Link public specifications or official model sources; do not attach private media.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal preserves explicit AI disclosure and consent revocation.
          required: true
        - label: The proposal does not require committing real-person media, adapters, or credentials.
          required: true
