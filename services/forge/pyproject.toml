[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-forge"
version = "0.1.0"
description = "Trusted skill supply chain and evaluation-driven evolution for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=45,<47", "fastapi>=0.116,<1", "pydantic>=2.11,<3", "pyyaml>=6,<7", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
evoagent-forge = "evoagent_forge.cli:main"

[project.urls]
Homepage = "https://github.com/Linxiushen/evoagent-forge"
Repository = "https://github.com/Linxiushen/evoagent-forge"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evoagent_forge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
