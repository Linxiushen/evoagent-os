<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvoAgent Forge</title><link rel="stylesheet" href="/assets/styles.css">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script></head>
<body><header><div><span class="mark">EF</span><strong>EvoAgent Forge</strong></div><span id="health">connecting</span></header>
<main><section class="toolbar"><div><h1>Trusted skill registry</h1><p>Signed, scanned and reproducible agent capabilities.</p></div><label><i data-lucide="search"></i><input id="query" placeholder="Search skills"></label></section>
<section><div class="section-title"><h2>Releases</h2><span id="count">0</span></div><div id="releases" class="grid"></div></section></main>
<template id="empty"><div class="empty"><i data-lucide="package-search"></i><h3>No releases found</h3><p>Publish an .evoskill artifact with the CLI.</p></div></template>
<script src="/assets/app.js"></script></body></html>
