# Copy this file to the private job mount and replace only private paths.
# The copied file and every training WAV are SHA-256-bound by the job manifest.
pretrained_path: /models/VoxCPM2
train_manifest: /private/echoweave/job/train.jsonl
val_manifest: null
sample_rate: 16000
out_sample_rate: 48000
batch_size: 2
grad_accum_steps: 8
num_workers: 8
num_iters: 1000
log_interval: 10
valid_interval: 500
save_interval: 500
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 100
max_steps: 1000
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: /private/echoweave/job/checkpoints/voxcpm2-lora
tensorboard: /private/echoweave/job/checkpoints/voxcpm2-lora/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
