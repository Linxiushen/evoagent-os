name: Bug report
description: Report a reproducible defect using synthetic or demo data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private logs, consent records, or real-person media.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Realtime protocol or gateway
        - VAD or ASR
        - LLM or TTS
        - Avatar or media playback
        - Consent or security
        - UI or accessibility
        - Packaging or deployment
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use the fictional demo persona and redact tokens, URLs, and private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, real-person media, biometric data, and private authorization artifacts.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
